<script>
/* Website mode on phones is laid out like the desktop site (compact); App mode uses the normal phone layout. */
try{var a=localStorage.getItem('nk_app');var app=a===null?(window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true):JSON.parse(a);

</script>
